# The wasm plugin's linker flags. Zellij instantiates one copy of the plugin
# per tab, each with its own linear memory, so per-instance fixed memory is
# paid N times per session.
#
# `-zstack-size`: the WASI shadow stack. wasm-ld's default is 1 MiB, which
# alone put the plugin's initial linear memory at 19 pages (1.2 MiB) before
# any heap — an 8-tab session held ~10 MiB of stacks. The plugin's deepest
# call chains are serde_json's decode (recursion capped at 128 by the
# library) and the renderer, neither of which comes near 256 KiB; the wasm
# traps loudly on overflow rather than corrupting memory, and the live E2E
# suite exercises load, every event class, and a full-height render.
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=-zstack-size=262144"]
